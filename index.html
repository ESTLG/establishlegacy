<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/LegacyWhiteEmbl.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Established Legacy</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- GitHub Pages has no server-side routing, so a deep link like
         /establishlegacy/about gets redirected here as a query string
         by 404.html, then this script restores the real URL. See
         https://github.com/rafgraph/spa-github-pages -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
